# Build the container image of the environment from pixi.lock (lesson 08)
# and publish it to the GitHub Container Registry (ghcr.io), on every
# release and on demand (Actions tab -> Container image -> Run workflow).
name: Container image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registry names must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          build-args: ENV_NAME=default
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest

      - name: Check the image runs the tools
        run: docker run --rm ${{ steps.name.outputs.image }}:${{ github.ref_name }} bash -c "python --version && bcftools --version | head -n 1 && snakemake --version"

      - name: Image ID for the README
        run: |
          echo "Image: ${{ steps.name.outputs.image }}:${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
